name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get update && sudo apt-get install -y shellcheck jq zsh ksh fish
        if: runner.os == 'Linux'

      - run: brew install shellcheck jq fish
        if: runner.os == 'macOS'

      - run: make test
